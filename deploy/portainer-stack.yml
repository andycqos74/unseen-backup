# Central Backup — Portainer stack (pulls prebuilt images, no local build).
#
# Use this instead of docker-compose.yml / agent-docker-compose.yml when the
# host is too small to compile the images, or when you want the stack
# managed by Portainer. Images come from GHCR, built by
# .github/workflows/images.yml.
#
# Portainer → Stacks → Add stack → Web editor, paste this, and set the
# environment variables listed below.
#
# Required environment variables:
#   CB_TAG          image tag to deploy, e.g. "main" or a branch name
#   CB_SERVER_NAME  DNS name in the TLS certificate, e.g. backup.example.com
#   CB_PUBLIC_URL   externally reachable origin, e.g. https://backup.example.com:8443
#   CB_OWNER        GitHub owner the images were published under
#
# Optional (separate admin listener — see docs/deployment.md §3):
#   CB_ADMIN_LISTEN :8444 to move the GUI/admin API off the agent port; 8443
#                   then serves agents only. The admin port is bound to
#                   127.0.0.1 below — put cloudflared in front of it.
#   CB_ADMIN_URL    browser address of the GUI, e.g. https://backup-admin.example.com
#
# IMPORTANT — the volumes below are declared `external` on purpose. Compose
# normally prefixes volume names with the stack name, so deploying this as a
# differently named stack would silently create *empty* volumes and the
# server would come up with no database, no certificate (a new fingerprint
# breaks every enrolled agent) and no backups. Naming the existing volumes
# explicitly makes the stack name irrelevant. Check yours first with
# `docker volume ls | grep backup` and adjust the two `name:` fields if they
# differ.

services:
  backup-server:
    image: ghcr.io/${CB_OWNER}/unseen-backup-server:${CB_TAG}
    container_name: backup-server
    restart: unless-stopped
    ports:
      - "8443:8443"
      - "127.0.0.1:8444:8444"
    environment:
      CB_SERVER_NAME: ${CB_SERVER_NAME}
      CB_PUBLIC_URL: ${CB_PUBLIC_URL}
      CB_ADMIN_LISTEN: ${CB_ADMIN_LISTEN:-}
      CB_ADMIN_URL: ${CB_ADMIN_URL:-}
      # --- Optional: MeshCentral remote access (see docs/remote-access.md).
      # Unset = feature off.
      CB_MESH_URL: ${CB_MESH_URL:-}               # e.g. https://mesh.example.com (UI via tunnel)
      CB_MESH_API_URL: ${CB_MESH_API_URL:-}       # e.g. https://meshcentral:443 (internal)
      CB_MESH_AGENT_URL: ${CB_MESH_AGENT_URL:-}   # e.g. https://agents.example.com:4443
      CB_MESH_LOGIN_KEY: ${CB_MESH_LOGIN_KEY:-}   # same value as MESH_LOGIN_KEY
      CB_MESH_USER: ${CB_MESH_USER:-}             # MeshCentral account to act as (default admin)
      CB_MESH_GROUP: ${CB_MESH_GROUP:-}           # device group for new clients
    volumes:
      - backup-data:/data

  backup-agent:
    image: ghcr.io/${CB_OWNER}/unseen-backup-agent:${CB_TAG}
    container_name: backup-agent
    restart: unless-stopped
    environment:
      # Only read on first enrollment; harmless to leave empty once the
      # agent has credentials in its volume.
      CB_SERVER: ${CB_SERVER:-}
      CB_TOKEN: ${CB_TOKEN:-}
      CB_FINGERPRINT: ${CB_FINGERPRINT:-}
      CB_NAME: ${CB_NAME:-}
    volumes:
      - backup-agent-data:/var/lib/backup-agent
      - /:/host:ro
      - /var/run/docker.sock:/var/run/docker.sock

  # ---- Optional: MeshCentral remote access (desktop / terminal / files) ----
  # Remove this service (and its volumes below) if you don't use remote access.
  # See docs/remote-access.md. Required variables:
  #   MESH_AGENT_HOST  DNS name MeshAgents connect to (grey-cloud, must contain a dot),
  #                    e.g. agents.example.com
  #   MESH_UI_HOST     hostname of the MeshCentral UI on your Cloudflare Tunnel,
  #                    e.g. mesh.example.com
  #   MESH_LOGIN_KEY   160 hex chars, shared with the backup server as
  #                    CB_MESH_LOGIN_KEY: openssl rand -hex 80  (keep in Vaultwarden)
  # Only the agent port is published. The UI (443 in the container) is reached
  # through cloudflared (https://meshcentral:443, "No TLS Verify") or, as a
  # fallback, an SSH tunnel to 127.0.0.1:8445.
  meshcentral:
    image: ghcr.io/ylianst/meshcentral:${MESH_TAG:-1.3.1}
    container_name: meshcentral
    restart: unless-stopped
    ports:
      - "${MESH_AGENT_PORT:-4443}:${MESH_AGENT_PORT:-4443}"
      - "127.0.0.1:8445:443"
    environment:
      MESH_AGENT_HOST: ${MESH_AGENT_HOST:-}
      MESH_AGENT_PORT: ${MESH_AGENT_PORT:-4443}
      MESH_UI_HOST: ${MESH_UI_HOST:-}
      MESH_LOGIN_KEY: ${MESH_LOGIN_KEY:-}
      # The script below is the only writer of config.json; keep the image's
      # own env-to-config step off so the two don't fight.
      DYNAMIC_CONFIG: "false"
    # config.json is regenerated from the variables above on every start, so
    # edit the variables, not the file. agentPort is MeshCentral's agent-only
    # listener: agents, relay and agent downloads, but no login page. cert
    # must be the agent hostname (it goes into agent installers); the UI
    # hostname is allowed separately via allowedOrigin. tlsOffload/certUrl
    # stay off: tlsOffload would drop TLS on the agent port.
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -e
        case "$$MESH_AGENT_HOST" in *.*) ;; *) echo "MESH_AGENT_HOST must be a DNS name with a dot" >&2; exit 1;; esac
        [ -n "$$MESH_UI_HOST" ] || { echo "MESH_UI_HOST is required" >&2; exit 1; }
        [ $${#MESH_LOGIN_KEY} -eq 160 ] || { echo "MESH_LOGIN_KEY must be 160 hex characters (openssl rand -hex 80)" >&2; exit 1; }
        mkdir -p /opt/meshcentral/meshcentral-data
        jq -n --arg cert "$$MESH_AGENT_HOST" --arg ui "$$MESH_UI_HOST" --arg key "$$MESH_LOGIN_KEY" --argjson aport "$$MESH_AGENT_PORT" \
          '{settings: {cert: $$cert, port: 443, redirPort: 0, agentPort: $$aport, agentPortTls: true, tlsOffload: false,
                       LoginCookieEncryptionKey: $$key, SelfUpdate: false, WebRTC: false, AllowFraming: false, AgentPong: 300},
            domains: {"": {NewAccounts: false, allowedOrigin: [$$ui], minify: true}}}' \
          > /opt/meshcentral/meshcentral-data/config.json
        exec /bin/bash /opt/meshcentral/entrypoint.sh
    volumes:
      - meshcentral-data:/opt/meshcentral/meshcentral-data
      - meshcentral-files:/opt/meshcentral/meshcentral-files
      - meshcentral-backups:/opt/meshcentral/meshcentral-backups

volumes:
  backup-data:
    external: true
    name: deploy_backup-data
  backup-agent-data:
    external: true
    name: deploy_backup-agent-data
  # MeshCentral volumes are created by this stack (not external): they are
  # new, so there is no existing data to protect from stack-name prefixes.
  meshcentral-data:
  meshcentral-files:
  meshcentral-backups:
